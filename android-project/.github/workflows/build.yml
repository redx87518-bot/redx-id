name: Build Redx ID Card APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate release keystore
        run: |
          keytool -genkeypair \
            -alias redxkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore app/release.keystore \
            -storepass redxidcard \
            -keypass redxidcard \
            -dname "CN=RedxIDCard, OU=Redx, O=Redx, L=Lagos, S=Lagos, C=NG" \
            -noprompt
          echo "Keystore generated ✓"

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/RedxIDCard.apk
          ls -lh output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedxIDCard-APK
          path: output/RedxIDCard.apk
          retention-days: 30

      - name: Show build summary
        run: |
          echo "✅ Build complete!"
          echo "APK size: $(du -h output/RedxIDCard.apk | cut -f1)"
